[pytest]
# pytest 기본 설정 파일

# 테스트 검색 패턴
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 테스트 디렉토리
testpaths = tests

# 출력 옵션
addopts =
    -v                      # verbose 모드
    --tb=short             # traceback을 짧게 표시
    --strict-markers       # 등록되지 않은 마커 사용 시 에러
    --cov=backend          # backend 폴더 커버리지 측정
    --cov-report=html      # HTML 리포트 생성
    --cov-report=term-missing  # 터미널에 누락된 라인 표시
    --cov-report=xml       # XML 리포트 생성 (CI/CD용)
    --cov-fail-under=80    # 커버리지 80% 미만 시 실패
    -p no:warnings         # 경고 메시지 숨김 (선택사항)

# 커스텀 마커 정의
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    security: Security related tests
    api: API tests
    database: Database tests
    dart: DART API related tests
    kiwoom: Kiwoom API related tests
    telegram: Telegram bot tests

# 비동기 테스트 설정
asyncio_mode = auto

# 로그 설정
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 최소 Python 버전
minversion = 7.0

# 테스트 검색 시 제외할 디렉토리
norecursedirs = .git .tox dist build *.egg venv __pycache__
